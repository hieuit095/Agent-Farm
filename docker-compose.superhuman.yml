version: "3.8"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.superhuman
    container_name: contribai_agent
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./memory.db:/app/memory.db:rw
      - ./logs:/app/logs:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
