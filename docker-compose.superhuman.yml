services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.superhuman
    container_name: farm_agent_core
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file: .env
    volumes:
      - ./data:/app/data:rw
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
