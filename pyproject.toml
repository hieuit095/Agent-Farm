[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farm_agent"
version = "4.0.0"
description = "Autonomous system that automatically contributes to open source projects on GitHub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Farm-Agent Development Team" }]
keywords = ["github", "open-source", "contributions", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "pyyaml>=6.0,<7.0",
    "click>=8.1,<9.0",
    "rich>=13.0,<14.0",
    "gitpython>=3.1,<4.0",
    "aiosqlite>=0.19,<1.0",
    "google-genai>=1.0,<2.0",
    "openai>=1.10,<2.0",
    "anthropic>=0.40,<1.0",
    "docker>=7.1,<8.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27,<1.0",
    "chromadb>=0.4,<1.0",
    "numpy>=1.24,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.3,<1.0",
    "respx>=0.21,<1.0",
]
local-llm = [
    "ollama>=0.4,<1.0",
]

[project.scripts]
farm_agent = "farm_agent.cli.main:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E", "F", "W", "B", "SIM", "N", "RUF", "I"]  # Mutable class defaults are standard in Pydantic models

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["farm_agent"]
omit = [
    "farm_agent/web/*",
    "farm_agent/scheduler/*",
    "farm_agent/plugins/*",
    "farm_agent/templates/*",
    "farm_agent/notifications/*",
    "farm_agent/cli/tui.py",
    "farm_agent/core/leaderboard.py",
    "farm_agent/core/profiles.py",
    "farm_agent/core/quotas.py",
    "farm_agent/llm/agents.py",
    "farm_agent/llm/models.py",
    "farm_agent/llm/router.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.hatch.build.targets.wheel]
packages = ["farm_agent"]
