# solidity-weak-randomness.yaml v036
# Targets: Using block data (blockhash, block.timestamp, block.coinbase) as sources of randomness
# Rationale: Block data is publicly visible and can be manipulated by miners/validators
# Precision: Flag when these values are used in contexts that determine outcomes (games, lotteries, assignment)
id: solidity-weak-randomness-blockhash
language: solidity
rule:
  pattern: block.blockhash($BLOCKNUM)
constraints:
  BLOCKNUM:
    not:
      kind: number
message: "block.blockhash() used as randomness source. block.blockhash is predictable by miners/validators and can be manipulated. For randomness, use Commit-Reveal scheme, VRF (Chainlink VRF), or Randao-based approaches."
severity: warning
tags: [security, randomness, miner-manipulation, DoS]

---
id: solidity-weak-randomness-timestamp
language: solidity
rule:
  pattern: block.timestamp
constraints:
  inside:
    kind: function_item
    stopBy: end
message: "block.timestamp used in a determination context (lottery, assignment, shuffle). Miners can manipulate block.timestamp within a small range (±15 seconds). Use Chainlink VRF or a commit-reveal scheme for cryptographic randomness."
severity: warning
tags: [security, timestamp, miner-manipulation]

---
id: solidity-weak-randomness-coinbase
language: solidity
rule:
  pattern: block.coinbase
message: "block.coinbase (block producer address) is a weak source of randomness since the block producer is known in advance and can be influenced via Sybil attacks. Do not use for randomness."
severity: warning
tags: [security, coinbase, randomness, block-producer]

---
id: solidity-weak-randomness-number
language: solidity
rule:
  pattern: block.number
message: "block.number is predictable and can be influenced by miners/validators. Do not use block.number alone as a source of randomness."
severity: warning
tags: [security, block-number, randomness]

---
