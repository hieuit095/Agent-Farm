# solidity-tx-origin.yaml
# Targets: Authentication using tx.origin instead of msg.sender
# Rationale: tx.origin can be exploited via malicious contracts that sit between the transaction sender and the target
id: solidity-tx-origin-auth
language: solidity
rule:
  pattern: |
    require($CHECK == tx.origin, $MSG)
where:
  CHECK:
    kind: member_access
    expression:
      text: "tx.origin"
message: "tx.origin used for authentication. Consider using msg.sender instead, as tx.origin can be manipulated by malicious contracts in the call chain."
severity: error
tags: [security, authentication, critical]

---
id: solidity-tx-origin-comparison
language: solidity
rule:
  pattern: |
    if ($CHECK == tx.origin) {
    $BODY
    }
where:
  CHECK:
    kind: identifier
message: "tx.origin comparison detected for access control. Use msg.sender instead to prevent phishing attacks."
severity: error
tags: [security, access-control]

---
id: solidity-unchecked-tx-origin
language: solidity
rule:
  pattern: "$RESULT = tx.origin"
where:
  RESULT:
    kind: identifier
message: "tx.origin assigned to variable. Verify this is intentional and not for authentication, as tx.origin is vulnerable to phishing."
severity: warning
tags: [security, authentication]
