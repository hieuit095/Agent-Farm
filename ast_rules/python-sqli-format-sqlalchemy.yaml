# python-sqli-format-sqlalchemy.yaml v036
# Targets: String formatting (.format(), %) in SQL execution contexts
# Rationale: Dynamic query construction with user input enables SQL injection
# Precision: Excludes parameterized calls that are safe
id: python-sqli-format-string
language: python
rule:
  pattern: $DB.execute("SELECT $COLS FROM $TABLE WHERE $WHERE".format($KVARS))
constraints:
  DB:
    has:
      member: "execute"
message: "SQL query constructed via .format() string interpolation. Use named/positional parameters: execute(text('SELECT :cols FROM :table WHERE :where'), {'cols': cols, 'table': table, 'where': where_val})."
severity: error
tags: [security, sqli, string-format]

---
id: python-sqli-percent-format
language: python
rule:
  pattern: $DB.execute("SELECT $COLS FROM $TABLE WHERE $WHERE" % $VARS)
constraints:
  DB:
    has:
      member: "execute"
message: "SQL query constructed via %-formatting. This enables SQL injection. Switch to parameterized queries with proper bound parameters."
severity: error
tags: [security, sqli, percent-format]

---
id: python-sqli-concat
language: python
rule:
  pattern: $DB.execute($Q1 + $Q2)
constraints:
  DB:
    has:
      member: "execute"
  Q1:
    not:
      kind: string
message: "SQL query built by concatenating strings before execute(). Parameterize the query to prevent injection."
severity: error
tags: [security, sqli, concatenation]

