# solidity-unchecked-send-value.yaml v036
# Targets: .send() calls where return value is not checked
# Rationale: send() returns false on failure but does not revert; ignoring the return enables silent payment failures
# Precision: Only flag if the return value is not immediately checked with require/if
id: solidity-unchecked-send
language: solidity
rule:
  pattern: $ADDR.send($AMOUNT)
message: ".send() return value is not checked. If the send fails, Ether is not transferred but execution continues silently. Always check the return: require($ADDR.send($AMOUNT), 'Transfer failed'); or use transfer()/pull-payment."
severity: error
tags: [security, payment, error-handling, silent-failure]

---
id: solidity-unchecked-call-value
language: solidity
rule:
  pattern: $ADDR.call{value: $AMOUNT}($DATA)
where:
  kind: expression_statement
message: "Low-level .call{value:} used without checking the return boolean. Use ReentrancyGuard or check the success return value: (bool success,) = $ADDR.call{value: $AMOUNT}($DATA); require(success, 'Call failed');"
severity: error
tags: [security, low-level-call, reentrancy, error-handling]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   recipient.send(payment);  # return value ignored
#   addr.call{value: amt}("");  # success not checked
#
# SHOULD NOT MATCH (safe):
#   require(addr.send(amount), "send failed");
#   (bool ok,) = addr.call{value: amt}(""); require(ok);
