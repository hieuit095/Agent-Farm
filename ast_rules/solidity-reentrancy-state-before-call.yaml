# solidity-reentrancy-state-before-call.yaml v036
# Targets: External .call{value:()} made BEFORE state variable updates (CEI violation)
# Rationale: Violating Checks-Effects-Interactions allows reentrancy attacks
# Precision: Detects .call{value:} occurring before any state variable assignment in the same function
# Limitation: Cannot do semantic ordering across statements; targets call patterns inside functions
id: solidity-reentrancy-cei-violation
language: solidity
rule:
  pattern: $TARGET.call{value: $AMOUNT}($DATA)
where:
  TARGET:
    not:
      kind: identifier
      regex: "^(this|super)$"
message: "External .call{value:} detected. This pattern is a high-risk reentrancy vector if state variables are not updated before the call. Always update all state variables BEFORE making external calls. Use ReentrancyGuard from OpenZeppelin or implement the Checks-Effects-Interactions pattern."
severity: error
tags: [security, reentrancy, CEI, critical]

---
id: solidity-reentrancy-callvalue-lowlevel
language: solidity
rule:
  pattern: |
    $ADDR.call.value($AMNT)()
where:
  AMNT:
    not:
      regex: "^0$"
message: "Low-level .call.value() with non-zero Ether. Always update state variables BEFORE any external call to prevent reentrancy attacks."
severity: error
tags: [security, reentrancy, low-level-call, critical]

---
id: solidity-reentrancy-transfer-pop
language: solidity
rule:
  pattern: $ADDR.transfer($AMOUNT)
message: "transfer() forwards 2300 gas and is deprecated. It can cause griefing if the recipient is a contract whose fallback requires more than 2300 gas. Use the pull-payment pattern or ReentrancyGuard."
severity: warning
tags: [security, reentrancy, transfer, deprecated]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   recipient.call{value: amount}("");
#   addr.call.value(msg.value)("");
#
# SHOULD NOT MATCH (safe):
#   balances[msg.sender] -= amount;  # state updated before call
#   (bool success,) = addr.call{value: amt}(""); require(success);
