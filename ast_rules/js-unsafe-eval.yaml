# js-unsafe-eval.yaml
# Targets: eval(), setTimeout/setInterval with string arguments, Function constructor
# Rationale: Dynamic code execution from untrusted input leads to arbitrary code execution
# Filter: Exclude tests/ directories
id: js-unsafe-eval
language: javascript
rule:
  pattern: eval($ARG)
constraints:
  ARG:
    not:
      kind: string
message: "Potentially unsafe eval() with dynamic argument. If $ARG contains user input, this can lead to arbitrary code execution (XSS or server-side RCE)."
severity: error
tags: [security, code-injection, xss]

---
id: js-unsafe-setTimeout
language: javascript
rule:
  pattern: setTimeout($FN, $DELAY)
constraints:
  FN:
    not:
      kind: arrow_function
      stopBy: end
      kind: function_expression
      stopBy: end
message: "setTimeout/setInterval with non-function first argument detected. This may indicate string-based code execution which is a security risk."
severity: error
tags: [security, code-injection]

---
id: js-unsafe-function-constructor
language: javascript
rule:
  pattern: new Function($ARG)
constraints:
  ARG:
    not:
      kind: string
message: "new Function() with dynamic argument detected. Prefer alternative approaches to avoid code injection vulnerabilities."
severity: error
tags: [security, code-injection]
