# python-sqli-fstring-execute.yaml v036
# Targets: f-string / format string flowing into database execution methods
# Rationale: String interpolation in SQL queries enables SQL injection attacks
# Filter: Must NOT trigger on hardcoded string literals
id: python-sqli-fstring-execute
language: python
rule:
  pattern: $DB.execute($QUERY)
constraints:
  DB:
    kind: call_expression
  QUERY:
    has:
      fstring: $ANY
where:
  ANY:
    not:
      inside:
        kind: string
message: "SQL query constructed with f-string interpolation into execute(). User-controlled input in $QUERY can enable SQL injection. Use parameterized queries: cursor.execute('SELECT * FROM users WHERE id = ?', (user_id,))."
severity: error
tags: [security, sqli, injection, critical]

---
id: python-sqli-format-sqlalchemy
language: python
rule:
  pattern: $DB.execute($QUERY)
constraints:
  DB:
    has:
      member: "execute"
  QUERY:
    has:
      any:
        - fstring: $ANY
        - call:
            function: "format"
message: "SQL query using .format() or f-string in execute(). This pattern allows SQL injection. Replace with parameterized queries: session.execute(text('SELECT * FROM users WHERE id = :id'), {'id': user_id})."
severity: error
tags: [security, sqli, injection]

---
id: python-sqli-raw-text
language: python
rule:
  pattern: $DB.execute($QUERY)
constraints:
  DB:
    has:
      any:
        - member: "raw"
        - member: "query"
        - member: "cursor"
  QUERY:
    has:
      any:
        - fstring: $ANY
        - binary: "+"
message: "SQL query using raw/text + string concatenation/interpolation. Use session.execute(text('...'), params) instead."
severity: error
tags: [security, sqli, raw-query]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   cursor.execute(f"SELECT * FROM users WHERE id={user_input}")
#   db.session.execute(f"SELECT * FROM products WHERE name='{name}'")
#
# SHOULD NOT MATCH (safe - parameterized):
#   cursor.execute("SELECT * FROM users WHERE id=?", (user_id,))
#   db.execute(text("SELECT * FROM users WHERE id = :id"), {"id": uid})
