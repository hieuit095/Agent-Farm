# go-nil-pointer-map-access.yaml v036
# Targets: Map access without nil guard in high-traffic / hot-path functions
# Rationale: Reading from a nil map returns zero value; writing to a nil map panics
# Precision: Exclude map accesses inside functions that have prior nil checks
id: go-nil-map-write
language: go
rule:
  pattern: $MAP[$KEY] = $VAL
constraints:
  MAP:
    kind: identifier
message: "Map write operation. Writing to a nil map panics at runtime. Ensure $MAP is initialized with make(map[K]V) before any write operations."
severity: error
tags: [security, nil-map, panic, DoS]

---
id: go-nil-map-read-hotpath
language: go
rule:
  pattern: $VAL = $MAP[$KEY]
constraints:
  MAP:
    kind: identifier
where:
  kind: function_item
message: "Map read in function context. If $MAP could be nil, add a nil check before accessing: if $MAP != nil { $VAL = $MAP[$KEY] }."
severity: warning
tags: [security, nil-map, initialization]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   var m map[string]int
#   m["key"] = 42  # writing to nil map panics
#
# SHOULD NOT MATCH (safe):
#   m := make(map[string]int)
#   m["key"] = 42  # initialized map is safe
