# go-sqli-string-concat.yaml v036
# Targets: String concatenation into SQL query execution via database/sql or gorm
# Rationale: Building SQL queries via string concat enables SQL injection
# Precision: Exclude parameterized queries that are safe
id: go-sqli-string-concat
language: go
rule:
  pattern: db.Query($SQLSTR)
constraints:
  SQLSTR:
    has:
      binary: "+"
message: "SQL query constructed via string concatenation (+). User input in $SQLSTR can cause SQL injection. Use parameterized queries: db.Query('SELECT * FROM users WHERE id = ?', userID) or db.Raw() with placeholders."
severity: error
tags: [security, sqli, injection, critical]

---
id: go-sqli-gorm-exec
language: go
rule:
  pattern: gorm.Exec($SQLSTR)
constraints:
  SQLSTR:
    has:
      any:
        - binary: "+"
        - call: "Sprintf"
message: "GORM Exec() with string-concatenated SQL. Use gorm.Where() with parameterized values or db.Raw() with ? placeholders."
severity: error
tags: [security, sqli, gorm]

---
id: go-sqli-raw-query
language: go
rule:
  pattern: db.Raw($SQLSTR)
constraints:
  SQLSTR:
    has:
      any:
        - binary: "+"
        - call: "Sprintf"
        - call: "fmt.Sprintf"
message: "db.Raw() with dynamic SQL construction via Sprintf or concatenation. Ensure all user inputs are passed as parameters, not interpolated into the SQL string."
severity: error
tags: [security, sqli, raw-query]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   db.Query("SELECT * FROM users WHERE id=" + userID)
#   db.Raw("SELECT * FROM items WHERE name='" + name + "'")
#   gorm.Exec("DELETE FROM logs WHERE id=" + id)
#
# SHOULD NOT MATCH (safe):
#   db.Query("SELECT * FROM users WHERE id=?", userID)
#   db.Raw("SELECT * FROM products WHERE category = ?", category)
