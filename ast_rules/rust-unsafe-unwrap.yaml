# rust-unsafe-unwrap.yaml
# Targets: .unwrap(), .expect(), .unwrap_unchecked() outside test code
# Rationale: These panic in production when the value is None/Err
# Exception: #[test] functions and tests/ directories are excluded
id: rust-unsafe-unwrap
language: rust
rule:
  pattern: $VAR.unwrap()
constraints:
  VAR:
    not:
      regex: "^(test_|mock_|tmp_)"
message: "Potentially unsafe unwrap() call detected outside test code. This will panic at runtime if the value is None/Err."
severity: warning
tags: [crash, panic]

---
id: rust-unsafe-expect
language: rust
rule:
  pattern: $VAR.expect($MSG)
constraints:
  VAR:
    not:
      regex: "^(test_|mock_|tmp_)"
message: "Potentially unsafe expect() call outside test code. Panic message suggests this may occur in production."
severity: warning
tags: [crash, panic]

---
id: rust-unsafe-unwrap-unchecked
language: rust
rule:
  pattern: $VAR.unwrap_unchecked()
message: "unwrap_unchecked() is unsafe and will cause undefined behavior if the value is None/Err."
severity: error
tags: [crash, memory-safety, udf]
