# go-unchecked-error.yaml
# Targets: Ignored error returns (_ = err, if err != nil { }) without proper handling
# Rationale: Ignoring errors leads to silent failures and unpredictable behavior
id: go-unchecked-error-assignment
language: go
rule:
  pattern: "_ = $ERR"
constraints:
  ERR:
    kind: call_expression
    has:
      any:
        - text: "Error()"
        - text: "err"
message: "Error return explicitly ignored. Use 'if err != nil { return err }' or handle the error properly."
severity: warning
tags: [error-handling, silent-failure]

---
id: go-unchecked-error-if
language: go
rule:
  pattern: |
    if err != nil {
    }
where:
  kind: if_statement
message: "Error checked but silently discarded. Log, return, or handle the error."
severity: warning
tags: [error-handling, silent-failure]

---
id: go-fmt-error-ignored
language: go
rule:
  pattern: "$RESULT = fmt.Sprintf($ARGS)"
where:
  RESULT:
    kind: identifier
message: "fmt.Sprintf result assigned but error return from calling function ignored. Check if the calling function returns an error."
severity: info
tags: [error-handling]
