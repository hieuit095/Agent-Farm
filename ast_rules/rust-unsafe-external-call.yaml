# rust-unsafe-external-call.yaml v036
# Targets: unsafe blocks making external calls or performing FFI without bounds checks
# Rationale: FFI calls bypass Rust's safety guarantees; missing bounds checks can corrupt memory
# Precision: Exclude test/benchmark contexts and internally-audited FFI wrappers
id: rust-unsafe-external-call
language: rust
rule:
  pattern: unsafe { $FUNC($ARGS) }
constraints:
  FUNC:
    has:
      any:
        - identifier: "memcpy"
        - identifier: "memmove"
        - identifier: "memset"
        - identifier: "strlen"
        - identifier: "strcpy"
message: "unsafe block calling memory-manipulation FFI function without explicit bounds validation. FFI functions like $FUNC do not perform bounds checking. Ensure $ARGS are validated before the call to prevent buffer overflows."
severity: error
tags: [security, unsafe, ffi, buffer-overflow, critical]

---
id: rust-unsafe-extern-call
language: rust
rule:
  pattern: |
    unsafe extern "C" {
        $FUNCS
    }
message: "Unsafe extern \"C\" block detected. Ensure all functions declared in this block have proper safety contracts and are reviewed for memory safety violations."
severity: error
tags: [security, unsafe, ffi, extern-c]

---
id: rust-unsafe-unchecked-index
language: rust
rule:
  pattern: $ARR.get_unchecked($IDX)
constraints:
  ARR:
    kind: identifier
message: "get_unchecked() bypasses Rust's bounds checking. Verify that $IDX is always within [$ARR.len()] bounds, or use the safe get() method. Out-of-bounds access with get_unchecked is undefined behavior."
severity: warning
tags: [security, unsafe, bounds-check, ud2]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   unsafe { memcpy(dest, src, len) }  # len not validated
#   unsafe { *ptr.offset(i) }  # offset not bounds-checked
#
# SHOULD NOT MATCH (safe):
#   arr[i]  # safe indexing with bounds check
#   arr.get(i)  # safe Option-based access
