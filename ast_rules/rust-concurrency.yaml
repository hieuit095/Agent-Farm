# rust-concurrency.yaml
# Targets: Unsafe lock acquisition, .lock().unwrap(), potential deadlocks
# Rationale: .lock().unwrap() panics if the lock is poisoned; improper lock ordering causes deadlocks
id: rust-lock-unwrap
language: rust
rule:
  pattern: $MUTEX.lock().unwrap()
message: "lock().unwrap() will panic if the mutex is poisoned. Consider using lock().unwrap_or_else(|e| panic(...)) for graceful handling."
severity: warning
tags: [crash, panic, mutex-poison]

---
id: rust-lock-expect
language: rust
rule:
  pattern: $MUTEX.lock().expect($MSG)
message: "lock().expect() will still panic on poison. Verify this is the intended behavior."
severity: warning
tags: [crash, panic, mutex-poison]

---
id: rust-nested-lock-deadlock
language: rust
rule:
  pattern: |
    $A.lock().unwrap();
    $B.lock().unwrap();
message: "Nested blocking lock acquisition detected. This pattern can cause deadlocks if locks are acquired in different orders elsewhere."
severity: warning
tags: [deadlock, concurrency]

---
id: rust-arc-weak-ref-leak
language: rust
rule:
  pattern: $REF.upgrade()
constraints:
  REF:
    kind: identifier
message: "Arc::upgrade() from Weak returns None if the Arc is already dropped. Verify this is handled."
severity: warning
tags: [null-dereference]
