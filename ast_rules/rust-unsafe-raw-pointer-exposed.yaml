# rust-unsafe-raw-pointer-exposed.yaml v036
# Targets: unsafe blocks that expose raw pointers through public functions
# Rationale: Raw pointer exposure from unsafe can lead to memory corruption if not bounds-checked
# Precision: Only flag public/exported functions; exclude test/bench contexts
id: rust-unsafe-raw-pointer-public
language: rust
rule:
  pattern: |
    pub fn $NAME() -> *const $TYPE
where:
  kind: function_item
message: "Public function returning a raw pointer without bounds checking or documentation. Raw pointer returns from unsafe blocks must be accompanied by explicit safety invariants and bounds validation. Document preconditions: pointer is valid, non-null, and aligned."
severity: error
tags: [security, unsafe, raw-pointer, memory-safety, critical]

---
id: rust-unsafe-raw-mut-pointer-public
language: rust
rule:
  pattern: |
    pub fn $NAME() -> *mut $TYPE
where:
  kind: function_item
message: "Public function returning a mutable raw pointer. Mutable raw pointers (*mut) allow exclusive memory access and can cause data races if shared. Ensure this is intentionally exposed and document the aliasing invariants."
severity: error
tags: [security, unsafe, raw-pointer, data-race, critical]

---
id: rust-unsafe-pointer-cast
language: rust
rule:
  pattern: $PTR as *const $TYPE
constraints:
  PTR:
    not:
      inside:
        kind: function_item
        stopBy: end
message: "Pointer cast inside unsafe block. Verify the cast is safe and the resulting pointer does not violate Rust's aliasing rules (noalias, align)."
severity: warning
tags: [security, unsafe, pointer-cast, aliasing]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   pub fn get_ptr() -> *const u8 { unsafe { data.as_ptr() } }
#   pub fn slice_ptr() -> *mut i32 { ptr.cast_mut() }
#
# SHOULD NOT MATCH (safe):
#   fn test_helper() -> *const u8 { ... }  # not pub
#   pub fn get_slice() -> &[u8] { &data[..] }  # safe reference
