# js-path-traversal-fs.yaml v036
# Targets: Node.js fs API calls with dynamic/unsanitized paths (f-strings, concatenation, variables)
# Rationale: User-controlled paths in file I/O can enable path traversal attacks (../../etc/passwd)
# Precision: Exclude hardcoded literal paths and test fixtures
id: js-path-traversal-readFile
language: javascript
rule:
  pattern: fs.readFile($PATH, $CB)
constraints:
  PATH:
    has:
      any:
        - template_literal: $ANY
        - binary: "+"
  PATH:
    not:
      kind: string
message: "fs.readFile() with dynamic path containing interpolation or concatenation. User-controlled paths can exploit path traversal (../) to read arbitrary files. Validate and sanitize the path, use path.resolve() and restrict to allowed directories."
severity: error
tags: [security, path-traversal, file-access, injection]

---
id: js-path-traversal-readFileSync
language: javascript
rule:
  pattern: fs.readFileSync($PATH)
constraints:
  PATH:
    has:
      any:
        - template_literal: $ANY
        - binary: "+"
  PATH:
    not:
      kind: string
message: "fs.readFileSync() with dynamic path. Ensure $PATH is validated and does not contain path traversal sequences."
severity: error
tags: [security, path-traversal, sync-io]

---
id: js-path-traversal-createReadStream
language: javascript
rule:
  pattern: fs.createReadStream($PATH)
constraints:
  PATH:
    has:
      any:
        - template_literal: $ANY
        - binary: "+"
  PATH:
    not:
      kind: string
message: "fs.createReadStream() with potentially unsanitized path. Validate path against a whitelist or use path.resolve() to prevent traversal attacks."
severity: error
tags: [security, path-traversal, stream]

---
id: js-path-traversal-writeFile
language: javascript
rule:
  pattern: fs.writeFile($PATH, $DATA)
constraints:
  PATH:
    has:
      any:
        - template_literal: $ANY
        - binary: "+"
  PATH:
    not:
      kind: string
message: "fs.writeFile() with dynamic path can enable path traversal attacks, allowing an attacker to write to arbitrary file locations."
severity: error
tags: [security, path-traversal, file-write]

---
# sg scan validation:
# SHOULD MATCH (vulnerable):
#   fs.readFile(`uploads/${filename}`)
#   fs.readFile(req.body.path + '.txt')
#   fs.createReadStream(userInput)
#
# SHOULD NOT MATCH (safe):
#   fs.readFile('/etc/passwd')  # hardcoded literal
#   fs.readFile(path.join(__dirname, 'data.json'))  # literal path
