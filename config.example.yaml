# ContribAI Configuration
# Copy this file to config.yaml and fill in your values

github:
  token: "ghp_your_github_personal_access_token"
  max_repos_per_run: 5
  max_prs_per_day: 10
  min_daily_prs: 3
  max_daily_prs: 10
  rate_limit_buffer: 100

llm:
  provider: "minimax"
  model: "MiniMax-M2.7"
  api_key: "your_minimax_api_key_here"
  temperature: 0.3
  max_tokens: 8192

notifications:
  telegram_token: ""          # BotFather token (123456:ABC-DEF)
  telegram_chat_id: ""        # Your Telegram chat ID

analysis:
  enabled_analyzers:
    - security
    - code_quality
    - docs
    - ui_ux
  severity_threshold: "medium"  # low | medium | high | critical
  max_file_size_kb: 500
  skip_patterns:
    - "*.min.js"
    - "*.min.css"
    - "vendor/*"
    - "node_modules/*"
    - "*.lock"

contribution:
  enabled_types:
    - security_fix
    - docs_improve
    - code_quality
    - feature_add
    - ui_ux_fix
    - performance_opt
    - refactor
  max_files_per_pr: 10
  run_tests_before_pr: true
  style:
    commit_convention: "conventional"
    pr_description_style: "detailed"

discovery:
  languages:
    - python
    - javascript
    - typescript
  stars_range: [50, 10000]
  min_last_activity_days: 30
  require_contributing_guide: false
  topics: []

storage:
  db_path: "~/.contribai/memory.db"
  cache_ttl_hours: 24

# ── Phase 4+ Configuration ──────────────────────────

pipeline:
  max_concurrent_repos: 3         # parallel repo processing
  timeout_per_repo_sec: 300
  # Fail-safe killswitch limits
  max_ci_retries: 3               # CI auto-heal attempts before surrendering
  max_discussion_replies: 3       # PR discussion replies before surrendering
  max_patch_retries: 2            # LLM patch correction re-prompts

scheduler:
  enabled: false
  cron: "0 */6 * * *"             # every 6 hours
  timezone: "UTC"
  max_concurrent: 3

web:
  host: "127.0.0.1"
  port: 8787
  enabled: true
  api_keys: []                     # ["cai_xxx"] for auth, empty = no auth
  webhook_secret: ""               # GitHub webhook secret for HMAC

quota:
  github_daily_limit: 5000
  llm_daily_limit: 1000
  llm_daily_tokens: 1000000

# Multi-model routing - auto-selects best model per task
multi_model:
  enabled: false                     # true to enable smart model routing
  strategy: "balanced"               # performance | balanced | economy
