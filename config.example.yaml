# Farm-Agent Configuration
# Copy this file to config.yaml and fill in your values

github:
  token: ""  # Leave empty — use GITHUB_TOKEN env var (from .env file)
  max_repos_per_run: 5
  max_prs_per_day: 10
  min_daily_prs: 3
  max_daily_prs: 10
  rate_limit_buffer: 100

llm:
  provider: "minimax"  # gemini | openai | anthropic | ollama | minimax
  model: "MiniMax-M2.7"
  api_key: "YOUR_API_KEY_HERE"
  temperature: 0.2
  max_tokens: 8192
  # For ollama (local models):
  # provider: "ollama"
  # model: "codellama:13b"
  # base_url: "http://localhost:11434"

analysis:
  enabled_analyzers:
    - security
    - code_quality
    - docs
    - ui_ux
  severity_threshold: "medium"  # low | medium | high | critical
  max_file_size_kb: 500
  skip_patterns:
    - "*.min.js"
    - "*.min.css"
    - "vendor/*"
    - "node_modules/*"
    - "*.lock"

contribution:
  enabled_types:
    - security_fix
    - docs_improve
    - code_quality
    - feature_add
    - ui_ux_fix
    - performance_opt
    - refactor
  max_files_per_pr: 10
  run_tests_before_pr: true
  style:
    commit_convention: "conventional"
    pr_description_style: "detailed"

discovery:
  languages:
    - python
    - javascript
    - typescript
    - rust
  stars_range: [1000, 20000]
  min_last_activity_days: 30
  require_contributing_guide: false
  topics: []

storage:
  db_path: "data/memory.db"
  cache_ttl_hours: 24

# ── Phase 4+ Configuration ──────────────────────────

pipeline:
  max_concurrent_repos: 3         # parallel repo processing
  timeout_per_repo_sec: 300

scheduler:
  enabled: false
  cron: "0 */6 * * *"             # every 6 hours
  timezone: "UTC"
  max_concurrent: 3

web:
  host: "127.0.0.1"
  port: 8787
  enabled: true
  api_keys: []                     # ["cai_xxx"] for auth, empty = no auth
  webhook_secret: ""               # GitHub webhook secret for HMAC

quota:
  github_daily_limit: 5000
  llm_daily_limit: 1000
  llm_daily_tokens: 1000000

notifications:
  slack_webhook: ""
  discord_webhook: ""
  telegram_token: "YOUR_TELEGRAM_TOKEN_HERE"
  telegram_chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"
  on_merge: true
  on_close: true
  on_run_complete: true

# Multi-model routing - auto-selects best model per task
multi_model:
  enabled: false                     # true to enable smart model routing
  strategy: "balanced"               # performance | balanced | economy
