# Farm-Agent Configuration v3.0
# Copy this file to config.yaml and fill in your values

github:
  token: ""  # Leave empty — use GITHUB_TOKEN env var (from .env file)
  max_repos_per_run: 5
  max_prs_per_day: 10
  min_daily_prs: 4
  max_daily_prs: 10
  rate_limit_buffer: 100
  dco_signoff: true
  # Additional GitHub tokens for GET request rotation (comma-separated in env var).
  # All mutation requests (PR/issue creation) always use the primary token.
  # Or set GITHUB_SECONDARY_TOKENS in .env (comma-separated).
  secondary_tokens: []

llm:
  provider: "openrouter"
  model: "deepseek/deepseek-v3.2"
  api_key: "YOUR_OPENROUTER_API_KEY_HERE"  # Or set OPENROUTER_API_KEY in .env
  temperature: 0.2
  max_tokens: 8192
  # For ollama (local models):
  # provider: "ollama"
  # model: "codellama:13b"
  # base_url: "http://localhost:11434"

analysis:
  enabled_analyzers:
    - security
    - code_quality
    - docs
    - ui_ux
  severity_threshold: "medium"  # low | medium | high | critical
  max_file_size_kb: 500
  skip_patterns:
    - "*.min.js"
    - "*.min.css"
    - "vendor/*"
    - "node_modules/*"
    - "*.lock"
  # Red Team engine — Bloodhound White-Hat audits via OpenRouter
  red_team_model: "cognitivecomputations/dolphin-mistral-24b-venice-edition:free"
  red_team_daily_limit: 1000
  # Semgrep radar — Sentinel Radar security scanner in Bloodhound pipeline
  use_semgrep: true
  semgrep_rulesets:
    - "p/security-audit"
    - "p/cwe-top-25"
    - "p/default"

contribution:
  enabled_types:
    - security_fix
    - docs_improve
    - code_quality
    - feature_add
    - ui_ux_fix
    - performance_opt
    - refactor
  max_files_per_pr: 10
  run_tests_before_pr: true
  style:
    commit_convention: "conventional"
    pr_description_style: "detailed"

discovery:
  languages:
    - python
    - javascript
    - typescript
    - rust
  stars_range: [1000, 20000]
  min_last_activity_days: 30
  require_contributing_guide: false
  topics: []

storage:
  db_path: "data/memory.db"
  cache_ttl_hours: 24

pipeline:
  max_concurrent_repos: 3
  timeout_per_repo_sec: 300

notifications:
  slack_webhook: ""
  discord_webhook: ""
  telegram_token: "YOUR_TELEGRAM_TOKEN_HERE"
  telegram_chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"

# Multi-model routing — auto-selects best model per task type
multi_model:
  enabled: false
  strategy: "balanced"  # performance | balanced | economy