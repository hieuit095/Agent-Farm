services:
  # ── Super Human Mode — default background daemon ─────────────────────────
  # Runs farm_agent superhuman as the 24/7 autonomous engine.
  # Start: docker compose up -d
  superhuman:
    image: worker-daemon:latest
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command: ["python", "-m", "farm_agent.cli.main", "superhuman"]
    container_name: contribai_superhuman_1
    restart: unless-stopped
    user: "0:0"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file: .env
    volumes:
      - farm_agent_db:/home/farm_agent/.farm_agent
      - ./data:/home/farm_agent/data:rw
      - ./config.yaml:/home/farm_agent/config.yaml:ro
      - ./logs:/home/farm_agent/logs:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw

  # ── One-shot run ─────────────────────────────────────────────────────────
  # Usage: docker compose run --rm runner run --dry-run
  runner:
    image: worker-daemon:latest
    build: .
    container_name: system_runner_1
    volumes:
      - farm_agent_db:/home/farm_agent/.farm_agent
      - ./config.yaml:/home/farm_agent/config.yaml:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    profiles:
      - cli

volumes:
  farm_agent_db:
