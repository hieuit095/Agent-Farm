# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Farm-Agent v3.0.0 — Docker Compose (DooD Architecture)            ║
# ║                                                                    ║
# ║  DooD = Docker-outside-of-Docker. The container mounts the host's  ║
# ║  Docker socket so the Sandbox Guillotine can spawn sibling          ║
# ║  containers for code validation.                                   ║
# ║                                                                    ║
# ║  Usage:                                                             ║
# ║    docker compose up -d          # Start 24/7 superhuman daemon     ║
# ║    docker compose logs -f        # Follow logs                      ║
# ║    docker compose down           # Stop                            ║
# ╚══════════════════════════════════════════════════════════════════════╝

services:
  farm_agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: farm-agent:3.0.0
    container_name: farm_agent
    restart: unless-stopped
    user: "0:0"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env
    volumes:
      # ── DooD: mount host Docker socket for Sandbox Guillotine ──────────
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # ── Data persistence (SQLite memory.db + ChromaDB) ──────────────────
      - ./data:/app/data:rw
      # ── Circular target loop queue ──────────────────────────────────────
      - ./target_repo.json:/app/target_repo.json:rw
      # ── Configuration (read-only) ───────────────────────────────────────
      - ./config.yaml:/app/config.yaml:ro
      # ── Environment variables (API keys, read-only) ────────────────────
      - ./.env:/app/.env:ro
      # ── Log persistence ─────────────────────────────────────────────────
      - ./logs:/app/logs:rw