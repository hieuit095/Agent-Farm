services:
  scheduler:
    image: worker-daemon:latest
    build: .
    container_name: contribai_scheduler_1
    command: ["schedule"]
    volumes:
      - farm_agent-data:/home/farm_agent/.farm_agent
      - ./config.yaml:/home/farm_agent/config.yaml:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    restart: unless-stopped

  # ── One-shot run ───────────────────────────────────
  # Usage: docker compose run --rm runner run --dry-run
  runner:
    image: worker-daemon:latest
    build: .
    container_name: system_runner_1
    volumes:
      - farm_agent-data:/home/farm_agent/.farm_agent
      - ./config.yaml:/home/farm_agent/config.yaml:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    profiles:
      - cli

volumes:
  farm_agent-data:
    driver: local
