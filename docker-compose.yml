version: '3.8'

services:
  agent-farm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-farm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./target_repo.json:/app/target_repo.json
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    networks:
      - internet_access
      - sandbox_isolated
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internet_access:
    driver: bridge
  sandbox_isolated:
    internal: true
